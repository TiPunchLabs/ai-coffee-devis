---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: every pushed commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv (version from [tool.uv] required-version)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Formatting (ruff format)
        run: uv run ruff format --check --diff .

      - name: Code quality (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Tests (Ollama and AgentMail mocked)
        run: uv run pytest -q

      - name: Pre-commit hooks (YAML, private keys, whitespace, shell)
        env:
          SKIP: gitleaks,ruff,ruff-format  # covered by the steps above and the secrets job
        run: uv tool run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the whole history, not only the last commit

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          curl -fsSLo "$archive" "${base}/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" gitleaks

      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
